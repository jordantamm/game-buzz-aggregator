[project]
name = "enricher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "temporalio==1.7.1",
    # [snappy] pulls in cramjam: franz-go compresses batches with snappy by
    # default, and without the codec the consumer dies on the first message.
    "aiokafka[snappy]==0.11.0",
    "asyncpg==0.29.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "sentence-transformers==3.3.0",
    "transformers==4.46.3",
    "torch==2.5.1",
    "numpy==2.5.3",
    "anthropic==0.40.0",
    "instructor==1.7.0",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "redis[asyncio]==5.2.0",
    "opentelemetry-api==1.28.2",
    "opentelemetry-sdk==1.28.2",
    "opentelemetry-exporter-otlp-proto-grpc==1.28.2",
    "opentelemetry-instrumentation-asyncio==0.49b2",
    "structlog==24.4.0",
    "protobuf==5.28.3",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enricher"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

# Labeled ambiguous-mention cases for the resolve_games disambiguation prompt.
#
# Every case here is one where trigram matching alone is NOT sufficient: the
# alias is a common English word, several games share a substring, or the game
# is referenced without its canonical name. Cases where trigram matching already
# wins at high confidence never reach the LLM, so testing them proves nothing.
#
# Fields:
#   text            the Reddit post body
#   candidates      what the trigram pass would have surfaced (id/name/aliases)
#   expected        list of game_ids that are correct, or [] for "none of these"
#   note            why this case is hard (documentation, not asserted)
#
# When adding cases, keep the hard-negative ratio high. A suite that is mostly
# easy positives will pass while the prompt quietly regresses on the collisions
# that actually corrupt data.

- text: "My controller keeps disconnecting mid-fight, anyone else on PC?"
  candidates:
    - id: control
      name: Control
      aliases: []
  expected: []
  note: "'controller' contains 'control'; hardware complaint, not the game"

- text: "Control is honestly the best thing Remedy has ever made. The Oldest House still gives me chills."
  candidates:
    - id: control
      name: Control
      aliases: []
  expected: [control]
  note: "Common-word title, but 'Remedy' and 'Oldest House' disambiguate it"

- text: "I need to control my spending, I keep buying games I never play"
  candidates:

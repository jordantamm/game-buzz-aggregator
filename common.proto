syntax = "proto3";
package gba.v1;

option go_package = "github.com/yourusername/game-buzz-aggregator/gen/go/gba/v1;gbav1";

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_REDDIT = 1;
  // Future sources slot in here:
  // SOURCE_BLUESKY = 2;
  // SOURCE_TWITCH = 3;
  // SOURCE_HACKERNEWS = 4;
}

message Engagement {
  int64 score = 1;        // upvotes / likes / equivalent
  int64 reply_count = 2;
  int64 view_count = 3;   // 0 when unknown
}

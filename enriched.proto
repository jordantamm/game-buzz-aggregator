syntax = "proto3";
package gba.v1;

import "gba/v1/mention.proto";

option go_package = "github.com/yourusername/game-buzz-aggregator/gen/go/gba/v1;gbav1";

message GameMatch {
  string game_id = 1;
  double confidence = 2;     // 0.0 .. 1.0
  string method = 3;         // "trigram" | "llm" | "exact"
}

message Sentiment {
  double score = 1;          // -1.0 (negative) .. 1.0 (positive)
  double magnitude = 2;      // 0.0 .. 1.0, intensity regardless of polarity
  string model_version = 3;
}

// EnrichedMention is the output of the enricher. It is fan-out friendly:
// when one raw mention matches multiple games, the enricher emits one
// EnrichedMention per matched game, partitioned by game_id, so each
// game's stream is independently ordered.
message EnrichedMention {
  Mention mention = 1;

  // For a single-game emission this has one element; multi-game matches
  // are emitted as separate EnrichedMention events. The list form is kept
  // so future variants (e.g. "topic-level" enrichment) don't need a schema change.
  repeated GameMatch game_matches = 2;

  Sentiment sentiment = 3;

  // 384-dim float32 vector, little-endian byte order.
  // Model: sentence-transformers/all-MiniLM-L6-v2 in the MVP.
  bytes embedding = 4;
  string embedding_model = 5;

  // Bumped on any logic change in the enricher; lets the sink decide
  // whether to overwrite an existing enrichment.
  string enricher_version = 6;
}
